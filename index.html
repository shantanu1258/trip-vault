<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fa" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Trip Vault</title>
    <script>
      (() => {
        const key = "trip-vault:theme";
        const saved = localStorage.getItem(key) || "system";
        const dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        try {
          const palette = JSON.parse(localStorage.getItem("trip-vault:published-palette") || "null");
          const tokens = palette && palette[dark ? "dark" : "light"];
          const names = { canvas: "canvas", surface: "surface", elevated: "elevated", ink: "ink", muted: "muted", line: "line", brand: "brand", brandSoft: "brand-soft", coral: "coral", success: "success", warning: "warning", danger: "danger" };
          // Old untouched stock palettes now use the bundled defaults, including before React loads.
          const legacy = (dark ? "#101819 #182223 #1f2b2c #eef0e9 #abb8b3 #3a4949 #b4dcd0 #26413e #f49174 #6fc7a3 #e8ae5c #f1837e" : "#f5f1e8 #fffdf8 #ffffff #182728 #5d6b6a #d8d3c7 #142f31 #dde9e5 #e8785b #2f7a60 #b06f28 #b04441").split(" ");
          const stock = tokens && Object.keys(names).every((key, index) => String(tokens[key]).toLowerCase() === legacy[index]);
          if (tokens && !stock) Object.entries(names).forEach(([key, name]) => {
            const value = tokens[key];
            if (/^#[0-9a-fA-F]{6}$/.test(value)) document.documentElement.style.setProperty(`--color-${name}`, `${parseInt(value.slice(1, 3), 16)} ${parseInt(value.slice(3, 5), 16)} ${parseInt(value.slice(5, 7), 16)}`);
          });
        } catch { /* bundled CSS palette remains active */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
